site_name: macOS Fan Monitor
site_description: Why is my Mac hot, and what should I close? A native terminal app for MacBook Pros and fanless Airs, built for the Agentic Builders Collective.
site_url: https://jensenloke.github.io/macos-fanMonitor/
repo_url: https://github.com/jensenloke/macos-fanMonitor
repo_name: jensenloke/macos-fanMonitor

theme:
  name: material
  logo: assets/abc-logo.png
  favicon: assets/abc-logo.png
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jensenloke
    - icon: material/account-group
      link: https://www.agenticbuilders.sg/
      name: Agentic Builders Collective

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide: user-guide.md
  - How It Works: how-it-works.md
  - The Algorithm: algorithm.md
  - Watchdog Integration: watchdog.md
  - Troubleshooting: troubleshooting.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
  - Changelog: changelog.md
