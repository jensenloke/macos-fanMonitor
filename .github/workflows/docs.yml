name: docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: read

# NOTE: Pages deploy is intentionally disabled.
#   GitHub Pages needs either a paid plan (this repo is private) or the repo set
#   to public. Once Pages is enabled → set:  gh api -X POST \
#     repos/OWNER/REPO/pages -f build_type=workflow
#   then switch `upload-pages-artifact` back to a deploy job using
#   actions/deploy-pages@v4 and add `pages: write` + `id-token: write` perms.

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict          # quality gate: fails on broken links
      - uses: actions/upload-artifact@v4     # deployable site/; retained 7 days
        with:
          name: site
          path: site
