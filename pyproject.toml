[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-fanmon"
description = "macOS fan / CPU / memory monitor — why is my Mac hot, and what to close. Built for the Agentic Builders Collective."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "rich>=13.0",
    "textual>=0.60",
]
authors = [{ name = "Jensen Loke" }]
keywords = ["macos", "fan", "cpu", "memory", "monitor", "tui", "textual", "thermal", "throttling", "macbook-air", "diagnostics", "agentic-builders"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
urls = { Homepage = "https://github.com/jensenloke/macos-fanMonitor", Repository = "https://github.com/jensenloke/macos-fanMonitor", Changelog = "https://github.com/jensenloke/macos-fanMonitor/blob/main/docs/changelog.md" }

[project.scripts]
fm = "fanmon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fanmon.__version__" }

[tool.setuptools.packages.find]
include = ["fanmon*"]

[tool.setuptools.package-data]
fanmon = ["*.tcss"]
